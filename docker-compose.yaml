version: '3'
services:
  nginx:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "8080:80"  # Mapeia a porta 8080 do host para a porta 80 do container
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"